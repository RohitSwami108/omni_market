<div class="omni-workspace-container">
  
  <!-- 1. Top Action Bar Component -->
  <app-product-header
    [totalCount]="totalRecordsCount()"
    [searchQuery]="searchQuery()"
    [isFilterDockOpen]="isFilterDockOpen()"
    [activeFilterCount]="selectedCategories().length"
    [selectedCount]="selectedRowIds().size"
    (searchChange)="onSearchChange($event)"
    (toggleFilterDock)="toggleFilterDock()"
    (addProduct)="openCreateDrawer()"
    (exportBulk)="onExportBulk()"
    (archiveBulk)="onArchiveBulk()"
  />

  <!-- 2. Main Workspace Layout (Dock + Central Data Grid) -->
  <div class="workspace-body-layout">

    <!-- Collapsible Filter Dock Component -->
    @if (isFilterDockOpen()) {
      <app-product-filter-dock
        [categories]="categoryOptions()"
        [selectedCategories]="selectedCategories()"
        [priceRange]="priceRange()"
        [selectedStockFilter]="stockFilter()"
        (categoryToggled)="toggleCategory($event)"
        (priceRangeChanged)="updatePriceRange($event)"
        (stockFilterChanged)="updateStockFilter($event)"
        (reset)="resetFilters()"
      />
    }

    <!-- Central Data Grid & Pagination Content -->
    <main class="grid-main-content">
      <app-product-table
        [products]="filteredProducts()"
        [selectedRowIds]="selectedRowIds()"
        [sortField]="sortField()"
        [sortDirection]="sortDirection()"
        [isAllSelected]="isAllSelected()"
        (sort)="handleSort($event)"
        (toggleSelectAll)="toggleSelectAll()"
        (toggleSelectRow)="toggleSelectRow($event)"
        (edit)="openEditDrawer($event)"
        (delete)="deleteProduct($event.product, $event.event)"
      />

      <!-- Sticky Pagination Bar Component -->
      <app-product-pagination
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalCount]="totalRecordsCount()"
        [displayedCount]="filteredProducts().length"
        (pageChange)="changePage($event)"
        (pageSizeChange)="changePageSize($event)"
      />
    </main>
  </div>

  <!-- 3. Slide-Out Action Drawer Component (Add / Edit Product) -->
  <app-product-drawer
    [isOpen]="isDrawerOpen()"
    [mode]="drawerMode()"
    [categories]="categoryOptions()"
    [product]="selectedProductForEdit()"
    (close)="closeDrawer()"
    (save)="onSaveProduct($event)"
  />

</div>
