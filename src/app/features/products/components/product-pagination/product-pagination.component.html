<footer class="sticky-pagination-bar">
  <div class="pagination-left">
    <span class="pagination-info">
      Showing <strong class="highlight">{{ startRecord() }}</strong> to <strong class="highlight">{{ endRecord() }}</strong> of <strong class="highlight">{{ totalCount() }}</strong> catalog records
    </span>
    <div class="page-size-selector">
      <span class="size-label">Rows per page:</span>
      <select class="size-dropdown" [value]="pageSize()" (change)="onPageSizeChange($event)">
        <option [value]="10">10</option>
        <option [value]="20">20</option>
        <option [value]="50">50</option>
      </select>
    </div>
  </div>

  <div class="pagination-nav">
    <button 
      type="button" 
      class="page-nav-btn" 
      [disabled]="currentPage() <= 1" 
      (click)="goToPage(currentPage() - 1)" 
      aria-label="Previous page">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
      </svg>
    </button>

    @for (page of visiblePages(); track $index) {
      @if (page === -1) {
        <span class="page-ellipsis">...</span>
      } @else {
        <button 
          type="button" 
          class="page-number-btn" 
          [class.active]="currentPage() === page"
          (click)="goToPage(page)">
          {{ page }}
        </button>
      }
    }

    <button 
      type="button" 
      class="page-nav-btn" 
      [disabled]="currentPage() >= totalPages()" 
      (click)="goToPage(currentPage() + 1)" 
      aria-label="Next page">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
      </svg>
    </button>
  </div>
</footer>
