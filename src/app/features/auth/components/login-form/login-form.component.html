<div class="auth-panel-fade">
  <div class="panel-header">
    <h2 class="panel-title">Welcome back to OmniMarket</h2>
    <p class="panel-subtitle">Access your organization workspace and inventory controls.</p>
  </div>

  <!-- Single Sign-On Actions -->
  <div class="sso-group">
    <button type="button" class="sso-btn">
      <svg class="sso-icon" viewBox="0 0 24 24">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2s.7 5.5 1.9 7.9l3.7-2.9z"/>
        <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16.5C3.7 20.2 7.5 23.5 12 23.5z"/>
      </svg>
      Continue with Google
    </button>
    <button type="button" class="sso-btn">
      <svg class="sso-icon" fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
      GitHub SAML
    </button>
  </div>

  <div class="divider-line">
    <span>or sign in with email</span>
  </div>

  <!-- Login Reactive Form -->
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
    
    <!-- Work Email -->
    <div class="form-group">
      <label for="login-email" class="form-label">Enterprise Email</label>
      <div class="input-container" [class.is-invalid]="loginForm.controls.email.invalid && (loginForm.controls.email.touched || loginForm.controls.email.dirty)">
        <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
          <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
        </svg>
        <input id="login-email" type="email" formControlName="email" class="form-input" placeholder="name@company.com" autocomplete="email">
      </div>
      <app-input-error [control]="loginForm.controls.email" fieldLabel="Enterprise Email"> </app-input-error>
    </div>

    <!-- Password -->
    <div class="form-group">
      <div class="label-row">
        <label for="login-password" class="form-label">Password</label>
        <a href="javascript:void(0)" class="forgot-link">Forgot password?</a>
      </div>
      <div class="input-container" [class.is-invalid]="loginForm.controls.password.invalid && (loginForm.controls.password.touched || loginForm.controls.password.dirty)">
        <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
        </svg>
        <input id="login-password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" class="form-input" placeholder="••••••••••••" autocomplete="current-password">
        <button type="button" class="toggle-eye" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
          @if (showPassword()) {
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
              <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.064 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
            </svg>
          } @else {
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
              <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
            </svg>
          }
        </button>
      </div>
      <app-input-error [control]="loginForm.controls.password" fieldLabel="Password"> </app-input-error>
    </div>

    <!-- Options -->
    <div class="form-aux-row">
      <label class="custom-checkbox">
        <input type="checkbox" formControlName="rememberMe">
        <span class="checkmark"></span>
        <span class="checkbox-label">Keep me signed in for 30 days</span>
      </label>
    </div>

    <!-- Submit CTA -->
    <button type="submit" class="primary-submit-btn" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <span class="btn-spinner"></span>
        <span>Verifying Credentials...</span>
      } @else {
        <span>Sign In to Dashboard</span>
        <svg class="cta-arrow" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      }
    </button>
  </form>
</div>
