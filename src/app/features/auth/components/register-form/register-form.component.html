<div class="auth-panel-fade">
  <div class="panel-header">
    <h2 class="panel-title">Start with OmniMarket Enterprise</h2>
    <p class="panel-subtitle">14-day dedicated sandbox access with live API access keys.</p>
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>              
    <!-- Full Name -->
    <div class="form-group">
      <label for="reg-name" class="form-label">Full Name</label>
      <div class="input-container" [class.is-invalid]="registerForm.controls.fullName.invalid && (registerForm.controls.fullName.touched || registerForm.controls.fullName.dirty)">
        <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
        </svg>
        <input id="reg-name" type="text" formControlName="fullName" class="form-input" placeholder="Sarah Jenkins" autocomplete="name">
      </div>
      <app-input-error [control]="registerForm.controls.fullName" fieldLabel="Full Name"> </app-input-error>
    </div>

    <!-- Work Email -->
    <div class="form-group">
      <label for="reg-email" class="form-label">Business Email</label>
      <div class="input-container" [class.is-invalid]="registerForm.controls.email.invalid && (registerForm.controls.email.touched || registerForm.controls.email.dirty)">
        <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
          <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
        </svg>
        <input id="reg-email" type="email" formControlName="email" class="form-input" placeholder="s.jenkins@enterprise.com" autocomplete="email">
      </div>
      <app-input-error [control]="registerForm.controls.email" fieldLabel="Business Email"> </app-input-error>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="reg-password" class="form-label">Master Password</label>
      <div class="input-container" [class.is-invalid]="registerForm.controls.password.invalid && (registerForm.controls.password.touched || registerForm.controls.password.dirty)">
        <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
        </svg>
        <input id="reg-password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" class="form-input" placeholder="Min 8 chars, uppercase & symbols">
        <button type="button" class="toggle-eye" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
          @if (showPassword()) {
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" /><path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.064 7 9.542 7 .847 0 1.669-.105 2.454-.303z" /></svg>
          } @else {
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z" /><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" /></svg>
          }
        </button>
      </div>
      
      <!-- Password Strength Meter -->
      <div class="strength-meter-container">
        <div class="strength-bars">
          <span class="bar" [class.active]="passwordStrength().score >= 1" [class]="passwordStrength().colorClass"></span>
          <span class="bar" [class.active]="passwordStrength().score >= 2" [class]="passwordStrength().colorClass"></span>
          <span class="bar" [class.active]="passwordStrength().score >= 3" [class]="passwordStrength().colorClass"></span>
          <span class="bar" [class.active]="passwordStrength().score >= 4" [class]="passwordStrength().colorClass"></span>
        </div>
        <span class="strength-label">Security: {{ passwordStrength().label }}</span>
      </div>

      <app-input-error [control]="registerForm.controls.password" fieldLabel="Master Password"> </app-input-error>
    </div>

    <!-- Terms Checkbox -->
    <div class="form-aux-row">
      <label class="custom-checkbox">
        <input type="checkbox" formControlName="agreeTerms">
        <span class="checkmark"></span>
        <span class="checkbox-label">
          I agree to the <a href="javascript:void(0)" class="terms-link">Master Services Agreement</a> and <a href="javascript:void(0)" class="terms-link">Privacy Policy</a>
        </span>
      </label>
      <app-input-error [control]="registerForm.controls.agreeTerms" customMessage="You must accept the enterprise terms to proceed."> </app-input-error>
    </div>

    <!-- Submit CTA -->
    <button type="submit" class="primary-submit-btn" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <span class="btn-spinner"></span>
        <span>Provisioning Workspace...</span>
      } @else {
        <span>Initialize Organization Workspace</span>
        <svg class="cta-arrow" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      }
    </button>
  </form>
</div>
