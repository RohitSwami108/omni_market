<div class="omni-auth-container">
  
  <!-- Left Side: High-Conversion Marketing Pane Component -->
  <app-auth-marketing />

  <!-- Right Side: Authentication Control Panel -->
  <main class="auth-form-pane">
    <div class="form-wrapper">
      
      <!-- Top Switcher -->
      <div class="auth-switcher-container">
        <div class="auth-switcher-rail">
          <button type="button" class="switch-tab" [class.active]="!isRegisterMode()" (click)="toggleMode(false)"> Sign In </button>
          <button type="button" class="switch-tab" [class.active]="isRegisterMode()" (click)="toggleMode(true)"> Create Account </button>
          <div class="slider-indicator" [class.slide-right]="isRegisterMode()"></div>
        </div>
      </div>

      <div class="auth-card-body">
        @if (!isRegisterMode()) {
          <app-login-form 
            [isSubmitting]="isSubmitting()" 
            (submitLogin)="handleLogin($event)" 
          />
        } @else {
          <app-register-form 
            [isSubmitting]="isSubmitting()" 
            (submitRegister)="handleRegister($event)" 
          />
        }
      </div>

      <!-- Trust Assurance Badging -->
      <footer class="form-footer">
        <div class="shield-badge">
          <svg viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" d="M8 0c-.69 0-1.843.265-2.928.56-1.11.3-2.229.655-2.887.87a1.54 1.54 0 0 0-1.044 1.262c-.596 4.477.787 7.795 2.464 9.99a11.777 11.777 0 0 0 3.732 3.031c.214.11.45.177.663.177.214 0 .45-.067.663-.177a11.777 11.777 0 0 0 3.732-3.03c1.677-2.196 3.06-5.514 2.464-9.991a1.54 1.54 0 0 0-1.044-1.262c-.658-.216-1.777-.57-2.887-.87C9.843.266 8.69 0 8 0zm0 4a1.5 1.5 0 0 1 1.5 1.5V7a.5.5 0 0 1-1 0V5.5A.5.5 0 0 0 8 5a.5.5 0 0 0-.5.5V7a.5.5 0 0 1-1 0V5.5A1.5 1.5 0 0 1 8 4zm-.75 6.25a.75.75 0 1 1 1.5 0 .75.75 0 0 1-1.5 0z"/>
          </svg>
          <span>End-to-End TLS 1.3 Encryption • FIPS 140-3 Hardware Protection</span>
        </div>
      </footer>
    </div>
  </main>
</div>
